<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="grad-hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2229" />
      <stop offset="100%" stop-color="#3A4552" />
    </linearGradient>
    <pattern id="diag-hero" width="28" height="28" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="28" stroke="rgba(255,255,255,0.06)" stroke-width="14" />
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#grad-hero)" />
  <rect width="1920" height="1080" fill="url(#diag-hero)" />
  <text x="98%" y="97%" text-anchor="end" dominant-baseline="text-bottom" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="rgba(255,255,255,0.35)" font-weight="600">PLACEHOLDER — Steel Fabrication Yard</text>
</svg>