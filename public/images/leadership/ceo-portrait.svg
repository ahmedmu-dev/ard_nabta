<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="grad-leadership" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4552" />
      <stop offset="100%" stop-color="#1C2229" />
    </linearGradient>
    <pattern id="diag-leadership" width="28" height="28" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="28" stroke="rgba(255,255,255,0.06)" stroke-width="14" />
    </pattern>
  </defs>
  <rect width="900" height="1200" fill="url(#grad-leadership)" />
  <rect width="900" height="1200" fill="url(#diag-leadership)" />
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="41" fill="rgba(255,255,255,0.85)" font-weight="600">Leadership Portrait Placeholder</text>
</svg>